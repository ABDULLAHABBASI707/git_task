name: Build & Push Signed APK to GitHub Release & Firebase

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-android:
    name: Build Android Signed APK & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          architecture: x64

      - name: Flutter clean & get packages
        run: |
          flutter clean
          flutter pub get

      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/task-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=task-keystore.jks
          EOF

      - name: Build Signed APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: build/app/outputs/apk/release/app-release.apk
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
          name: Release v1.0.${{ github.run_number }}
          body: "Automated release with signed APK."

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Decode Firebase Service Account
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 -d > $HOME/firebase.json

      - name: Upload to Firebase App Distribution
        run: |
          firebase auth:login:ci --token "$(cat $HOME/firebase.json)" || true
          firebase appdistribution:distribute build/app/outputs/apk/release/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --token "$(cat $HOME/firebase.json)" \
            --release-notes "Automated release from GitHub Actions" \
            ${{ secrets.FIREBASE_TESTERS && format('--testers="{0}"', secrets.FIREBASE_TESTERS) || '' }} \
            ${{ secrets.FIREBASE_GROUPS && format('--groups="{0}"', secrets.FIREBASE_GROUPS) || '' }}

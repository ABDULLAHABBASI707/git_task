name: Build & Release

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Clean project
        run: |
          flutter clean
          rm -rf android/.gradle
          rm -rf build

      - name: Build Android APK (release, split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Update iOS deployment target in Podfile
        run: |
          cp ios/Podfile ios/Podfile.bak
          if grep -q "^platform :ios" ios/Podfile; then
            sed -i '' "s/^platform :ios.*/platform :ios, '13.0'/" ios/Podfile
          else
            echo "platform :ios, '13.0'" | cat - ios/Podfile > temp && mv temp ios/Podfile
          fi

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS IPA (no codesign)
        run: |
          flutter build ios --no-codesign --release
          cd build/ios/iphoneos
          mkdir -p Payload
          ln -s ../Runner.app Payload/Runner.app
          zip -r app.ipa Payload

      - name: Write Firebase service account JSON
        run: echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > $HOME/firebase-service-account.json

      - name: Set GOOGLE_APPLICATION_CREDENTIALS env
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> $GITHUB_ENV

      - name: Install Firebase CLI
        run: curl -sL https://firebase.tools | bash

      - name: Distribute Android APK to Firebase App Distribution
        run: |
          for apk in build/app/outputs/apk/release/*.apk; do
            echo "Uploading $apk"
            firebase appdistribution:distribute "$apk" \
              --app ${{ secrets.FIREBASE_APP_ID }} \
              --groups "testers" \
              --release-notes "CI Build ${{ github.run_number }}"
          done

      - name: Distribute iOS IPA to Firebase App Distribution
        if: success()
        run: |
          firebase appdistribution:distribute build/ios/iphoneos/app.ipa \
            --app ${{ secrets.FIREBASE_IOS_APP_ID }} \
            --groups "testers" \
            --release-notes "CI iOS Build ${{ github.run_number }}"

      - name: Push artifacts to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            build/app/outputs/apk/release/*.apk
            build/ios/iphoneos/app.ipa
          tag: v1.0.${{ github.run_number }}
          token: ${{ secrets.TOKEN }}
